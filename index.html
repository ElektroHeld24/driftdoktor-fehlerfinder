{font-size:21px}}

<div class="wrap"><div class="head"><div class="brand">DRIFT<b>DOKTOR +</b></div><div class="muted">Controller-Fehlerfinder · Reparieren statt Neukaufen.</div></div><div class="body" id="ddf-view"><h2>Fehlerfinder wird geladen …</h2></div><div class="foot">Unverbindliche Ersteinschätzung – keine sichere Ferndiagnose. Bei Akku-Schäden oder Flüssigkeitskontakt nicht weiter betreiben.</div></div>
</div>
<script>
(function(){
'use strict';
var host=document.getElementById('ddf');
var view=host.querySelector('#ddf-view');
var models=[['ps5','PS5 DualSense'],['ps4','PS4 DualShock 4'],['one','Xbox One'],['series','Xbox Series X/S'],['elite','Xbox Elite Series 2'],['switch','Nintendo Switch (Joy-Con / Pro Controller)'],['other','Sonstiger Controller']];
var issues=[['drift','Stickdrift / ungewollte Bewegung'],['mechanical','Stick klemmt, hakt oder schleift'],['power','Controller schaltet sich nicht ein'],['charge','Controller lädt nicht / Akku schnell leer'],['connect','Controller verbindet sich nicht'],['buttons','Taste funktioniert nicht'],['trigger','Trigger oder Bumper defekt'],['other','Anderes Problem']];

var paths={
drift:[q('side','Welcher Stick ist betroffen?',['Links','Rechts','Beide','Unbekannt']),q('feel','Wie bewegt sich der Stick?',['Normal, springt in die Mitte zurück','Kehrt verzögert zurück','Hakt oder schleift','Unbekannt']),q('when','Wann tritt der Fehler auf?',['Ohne Berührung','Nach dem Loslassen','Nur gelegentlich','Unbekannt']),q('games','In mehreren Spielen?',['Ja','Nur in einem Spiel','Nicht getestet']),q('tester','Was zeigt ein Gamepad-Tester?',['Werte springen oder zittern','Werte bleiben abseits der Mitte','Werte normal','Nicht getestet']),q('tried','Was wurde bereits versucht?',['Noch nichts','Deadzone / Spieleinstellungen','Reset / Software / Kalibrierung','Mehrere Schritte ohne Erfolg'])],

power:[q('reaction','Was passiert beim Einschalten?',['Gar keine Reaktion','Leuchtet kurz und geht aus','Funktioniert nur am Kabel','Unbekannt']),q('home','Wie fühlt sich die PS-/Xbox-/Home-Taste an?',['Normal','Klemmt / fühlt sich defekt an','Andere Tasten ebenfalls defekt','Unbekannt']),q('supply','Anderes Kabel bzw. frische Batterien getestet?',['Danach funktioniert er','Ladeanzeige, aber kein Start','Keine Reaktion','Nicht getestet']),q('history','Gab es einen Vorfall?',['Sturz','Flüssigkeitskontakt','Akkulaufzeit wurde schlechter','Nein / unbekannt'])],
charge:[q('symptom','Was ist das Ladeproblem?',['Keine Ladeanzeige','Akku sehr schnell leer','Lädt nur in bestimmter Kabelposition','Funktioniert nur am Kabel']),q('on','Lässt sich der Controller einschalten?',['Ja','Nur am Kabel','Nein','Manchmal']),q('cable','Anderes Kabel und andere Stromquelle getestet?',['Ja, Problem behoben','Ja, unverändert','Noch nicht']),q('port','Wie sieht der Anschluss aus?',['Stecker wackelt','Sichtbar verschmutzt','Unauffällig','Unbekannt']),q('history','Weitere Auffälligkeiten?',['Akku aufgebläht / ungewöhnlich heiß','Flüssigkeitskontakt','Laufzeit schleichend schlechter','Keine'])],
connect:[q('symptom','Wie äußert sich das Verbindungsproblem?',['Nur kabellos','Auch über USB','Verbindung bricht ab','Controller wird nicht gefunden']),q('usb','Funktioniert ein USB-Datenkabel?',['Ja','Nein','Nicht getestet']),q('reset','Reset und erneute Kopplung versucht?',['Ja, behoben','Ja, ohne Erfolg','Noch nicht']),q('device','Auf zweitem Gerät getestet?',['Funktioniert dort','Dort ebenfalls Fehler','Nicht getestet'])],

trigger:[q('which','Welcher Trigger / Bumper?',['L1 / LB','R1 / RB','L2 / LT','R2 / RT','Mehrere']),q('feel','Wie zeigt sich der Fehler?',['Keine Reaktion','Nur manchmal','Klemmt','Klickgefühl verändert','Reagiert nicht über gesamten Weg']),q('mod','Mausklick-/Smart-Trigger verbaut?',['Ja','Nein','Unbekannt']),q('history','Vorgeschichte?',['Sturz','Flüssigkeit','Langsam schlechter geworden','Unbekannt'])],
other:[q('which','Welcher Bereich ist betroffen?',['Audio / Mikrofon','Vibration','Touchpad / Sensor','Gehäuse / Mechanik','Anderes / unbekannt'])]
};
var state={};var page=0;
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function name(list,n){return list[n]&&list[n][1]||'';}
function pages(){var a=[q('model','Welchen Controller hast du?',models.map(function(x){return x[1];}))];if(state.model===6)a.push(q('modelname','Welches Modell genau?',[]));a.push(q('issue','Was funktioniert nicht?',issues.map(function(x){return x[1];})));if(state.issue!=null)a=a.concat(paths[issues[state.issue][0]]);return a;}
function draw(){var all=pages();if(page>=all.length){result();return;}var x=all[page];var progress=Math.round(page/all.length*100);var html='<div class="bar"><div class="fill" style="width:'+progress+'%"></div></div><div class="muted">Schritt '+(page+1)+' von '+all.length+'</div><h2>'+esc(x.title)+'</h2>';
if(x.id==='modelname'){html+='<input id="ddf-input" maxlength="100" placeholder="Marke und Modell (optional)" value="'+esc(state.modelname||'')+'">';}else{x.opts.forEach(function(o,i){html+='<button type="button" class="opt'+(state[x.id]===i?' sel':'')+'" data-choice="'+i+'">'+esc(o)+'</button>';});}
html+='<div class="actions"><button type="button" class="btn alt" id="ddf-back"'+(page===0?' disabled':'')+'>← Zurück</button><button type="button" class="btn" id="ddf-next"'+(x.id!=='modelname'&&state[x.id]==null?' disabled':'')+'>Weiter →</button></div>';view.innerHTML=html;
view.querySelectorAll('[data-choice]').forEach(function(b){b.onclick=function(){var n=Number(b.getAttribute('data-choice'));if(x.id==='model'&&state.model!==n)state={model:n};else if(x.id==='issue'&&state.issue!==n)state={model:state.model,modelname:state.modelname,issue:n};else state[x.id]=n;draw();};});
var input=view.querySelector('#ddf-input');if(input)input.oninput=function(){state.modelname=input.value;};view.querySelector('#ddf-back').onclick=function(){if(page>0){page--;draw();}};view.querySelector('#ddf-next').onclick=function(){if(x.id!=='modelname'&&state[x.id]==null)return;page++;draw();};}
function result(){var p=issues[state.issue][0],x=state;var xbox=[2,3,4].includes(x.model);var r={title:'Weitere Prüfung empfohlen',status:'Ursache noch unklar',causes:[],steps:[],repair:'Wenn der Fehler bestehen bleibt, ist eine Werkstattprüfung sinnvoll.',level:'Abhängig vom Defekt',tmr:false};
if(p==='drift'){var mech=x.feel===1||x.feel===2;var sensor=x.tester===0||x.tester===1;var game=x.games===1&&x.tester===2;r.title=mech?'Mechanisches Stickproblem möglich':sensor?'Stickdrift / Sensorproblem wahrscheinlich':game?'Spieleinstellungen als Ursache möglich':'Möglicher Stickdrift – weitere Prüfung sinnvoll';r.causes=mech?['Mechanische Rückstellung oder Reibung','Verschmutzung / Stickmodul']:game?['Deadzone oder Spieleinstellungen','Zeitweise auftretender Stickfehler']:['Positionssensorik oder Potentiometerverschleiß','Kontakt- oder Kalibrierungsproblem','Spieleinstellungen / Deadzone'];r.steps=['Deadzone und Einstellungen des Spiels prüfen.','Wenn möglich in einem zweiten Spiel testen.','Controller-Software aktualisieren und modellgerechten Reset versuchen.','Gamepad-Tester mehrfach prüfen: Stick bewegen, loslassen und Rückkehr zur Mitte beobachten.'];if(mech)r.steps=['Controller ausschalten und auf Reibung an der Sticköffnung prüfen.','Äußere lose Verschmutzung mit trockenem weichem Pinsel entfernen.','Bei mechanischem Haken keine Gewalt anwenden.'];r.repair='Bei wiederholtem Fehler kann eine Prüfung und gegebenenfalls Stickreparatur sinnvoll sein.';r.level='Schwierig (Stickmodul / Lötarbeiten)';r.tmr=true;}
if(p==='mechanical'){var fixed=x.clean===0;r.title=fixed?'Mechanisches Problem möglicherweise behoben':'Mechanische Stickbehinderung möglich';r.causes=['Reibung zwischen Stickkappe und Gehäuse','Staub oder Fremdkörper','Defekt an Rückstellmechanik oder Stickmodul'];r.steps=['Controller ausschalten.','Stick vorsichtig bewegen und auf Reibung prüfen.','Lose Verschmutzung außen trocken mit weichem Pinsel entfernen.','Bei anhaltendem Schleifen nicht mit Gewalt weiterbewegen.'];r.repair=fixed?'Im Spiel erneut testen; bei Rückkehr des Problems prüfen lassen.':'Bei weiterem Klemmen Stickkappe, Gehäuse und Modul fachgerecht prüfen lassen.';r.level='Mittel bis schwierig';r.tmr=!fixed;}
if(p==='power'){r.title='Controller startet nicht – mehrere Ursachen möglich';r.causes=['Defekte PS-/Xbox-/Home-Taste oder deren Kontaktflächen','Akku, Batterien oder Stromversorgung','USB-Buchse, Ladeelektronik oder Platine'];r.steps=[xbox?'Bei Xbox-Modellen mit AA-Fach frische Batterien korrekt einsetzen.':'Geeignetes Kabel und passende Stromquelle testen.','PS-/Xbox-/Home-Taste auf Klemmen oder fehlenden Druckpunkt prüfen.','Wenn eine Reaktion erfolgt, modellgerechten Reset und erneute Kopplung versuchen.'];if(x.history===1)r.steps=['Nach Flüssigkeitskontakt nicht weiter einschalten oder laden.','Fachgerechte Prüfung veranlassen.'];r.repair='Bei der Diagnose unbedingt auch Einschalttaste, Kontakte und Leiterbahnen prüfen, nicht nur den Akku.';r.level='Mittel bis schwierig';}
if(p==='charge'){var risk=x.history===0||x.history===1;r.title=x.cable===0?'Ladeproblem möglicherweise behoben':'Lade- oder Akkuproblem – Ursache offen';r.causes=(xbox?['Bei AA-Modellen: Normale AA-Batterien werden nicht über USB geladen.']:[]).concat(['Kabel oder Stromquelle','Akku / Batteriepack','USB-Anschluss oder Ladeelektronik']);r.steps=risk?['Bei aufgeblähtem Akku, ungewöhnlicher Hitze oder Flüssigkeit nicht weiter laden oder verwenden.','Fachgerechte Prüfung veranlassen.']:['Geeignetes, funktionierendes Kabel und andere Stromquelle testen.','Ladeanschluss von außen auf Schäden prüfen.','Bei kurzer Laufzeit Verhalten nach vollständigem Laden vergleichen.'];r.repair='Bei anhaltendem Fehler Akku/Batteriepack, USB-Buchse und Ladeelektronik prüfen lassen.';r.level='Mittel bis schwierig';}
if(p==='connect'){r.title=x.reset===0?'Verbindung möglicherweise wiederhergestellt':'Verbindungsproblem – Ursache noch offen';r.causes=['Kopplung, Software oder USB-Datenkabel','Funkstörung oder Bluetooth-/Funkverbindung','Möglicher Antennen-, Funkmodul- oder Platinenfehler'];r.steps=['Controller und Konsole/PC neu starten.','Alte Kopplung entfernen und neu koppeln.','Geeignetes USB-Datenkabel und anderen Port testen.','Controller- und Systemsoftware aktualisieren.','Wenn möglich an einem zweiten Gerät testen.'];r.repair='Bei weiterhin fehlender Verbindung USB-Datenverbindung und gegebenenfalls Funkhardware prüfen lassen.';r.level='Mittel bis schwierig';}
if(p==='buttons'){r.title='Tasten- oder Kontaktfehler möglich';r.causes=['Verschmutzte oder beschädigte Kontaktflächen','Gummimatte, Leiterfolie, Schalter oder Leiterbahn','Möglicher Defekt an nachgerüsteten Bauteilen'];r.steps=['Taste vorsichtig auf Klemmen prüfen.','Falls möglich Tastendruck in einem Eingabetest prüfen.','Nur lose äußere Verschmutzung trocken entfernen.','Bei defekter Home-Taste auch Einschaltprobleme berücksichtigen.'];r.repair='Kontakte, Leiterfolie, Schalter und bei Umbauten Modding-Bauteile prüfen lassen.';r.level='Mittel bis schwierig';}
if(p==='trigger'){r.title='Trigger-/Bumperdefekt möglich';r.causes=x.mod===0?['Defekter Mausklick-/Mikroschalter (z. B. Omron)','Lötstelle oder Modding-Verkabelung','Mechanischer Defekt']:['Kontakt- oder Schalterproblem','Feder oder Triggermechanik','Elektronische Erfassung / Leiterbahn'];r.steps=['Beweglichkeit und Druckpunkt vorsichtig prüfen.','Auslösung wenn möglich im Eingabetest kontrollieren.','Bei ungewöhnlichem Klickgefühl keine Gewalt anwenden.'];r.repair='Originalkontakte oder nachgerüstete Mikroschalter und Lötstellen prüfen lassen.';r.level='Mittel bis schwierig';}
if(p==='other'){r.title='Individuelle Fehlerprüfung empfohlen';r.causes=['Die genaue Ursache lässt sich anhand dieser Angaben nicht sicher eingrenzen.'];r.steps=['Controller-Modell und genaue Symptome notieren.','Wenn möglich kurzes Video des Problems aufnehmen.','Bei ungewöhnlicher Hitze, Akku- oder Flüssigkeitsschaden nicht weiter betreiben.'];}
var html='<div class="bar"><div class="fill" style="width:100%"></div></div><div class="muted">Dein persönliches Ergebnis</div><h2>'+esc(r.title)+'</h2><p>'+esc(name(models,x.model))+(x.model===6&&x.modelname?' – '+esc(x.modelname):'')+' · '+esc(name(issues,x.issue))+'</p><span class="tag">'+esc(r.status)+'</span><div class="card"><h3>Mögliche Ursachen</h3><ul>'+r.causes.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul><p class="muted">Mögliche Ursachen, keine bestätigten Defekte.</p></div><div class="card"><h3>Kostenlose Selbsthilfe</h3><ol>'+r.steps.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ol></div><div class="card"><h3>Wann ist eine Reparatur sinnvoll?</h3><p>'+esc(r.repair)+'</p><strong>Schwierigkeitsgrad einer Eigenreparatur:</strong> '+esc(r.level)+'</div>';
if(r.tmr&&x.model!==5&&x.model!==6)html+='<div class="card"><h3>TMR-Umbau bei DriftDoktor</h3><p>Bei geeigneten Controllern: Umbau beider Sticks für <strong>35 € inklusive Rückversand</strong>. Hinversand durch den Kunden. Die Eignung hängt vom Modell und tatsächlichen Defekt ab.</p></div>';
html+='<div class="links"><a class="btn" href="https://www.driftdoktor.de/kontakt" target="_blank" rel="noopener">DriftDoktor kontaktieren ↗</a><a class="btn alt" href="https://www.youtube.com/@DriftDoktor" target="_blank" rel="noopener">Hilfevideos auf YouTube ↗</a></div><div class="actions"><button class="btn alt" id="ddf-back">← Zurück</button><button class="btn alt" id="ddf-restart">↻ Neue Diagnose</button></div>';
view.innerHTML=html;view.querySelector('#ddf-back').onclick=function(){page=pages().length-1;draw();};view.querySelector('#ddf-restart').onclick=function(){state={};page=0;draw();};}
